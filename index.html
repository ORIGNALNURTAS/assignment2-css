<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 1 — Geometric Composition (CSS Grid)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Task 1. Geometric composition</h1>
    <p class="hint">A single CSS Grid, 6 columns × 6 rows. The black lines come from the grid gap, not from borders.</p>

    <div class="composition">
      <div class="block blue"></div>
      <div class="block yellow"></div>
      <div class="block light-a"></div>
      <div class="block grayR"></div>
      <div class="block red"></div>
      <div class="block black"></div>
      <div class="block grayMid"></div>
      <div class="block grayBottom"></div>
    </div>
  </main>
</body>
</html>
